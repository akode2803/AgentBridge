name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Core, MCP, and cloud extras: cloud-backed policy tests remain mocked,
      # but their optional Supabase dependency must be importable on both CI OSes.
      # Heavy memory/retrieval extras stay in their dedicated validation rounds.
      - name: Sync (core + dev + mcp + cloud)
        run: uv sync --group dev --extra mcp --extra cloud
      - name: Lint
        run: uv run ruff check agentbridge tests
      - name: Tests
        run: uv run pytest -q
      - name: Frontend module check
        run: uv run python check_frontend.py
        if: matrix.os == 'windows-latest'
