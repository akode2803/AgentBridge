name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Core, MCP, and cloud extras: cloud-backed policy tests remain mocked,
      # but their optional Supabase dependency must be importable on both CI OSes.
      # Heavy memory/retrieval extras stay in their dedicated validation rounds.
      - name: Sync (core + dev + mcp + cloud)
        run: uv sync --group dev --extra mcp --extra cloud
      - name: Lint
        run: uv run ruff check agentbridge tests devtools/check_frontend.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend module check
        run: uv run python devtools/check_frontend.py
      - name: Canonical GUI finalization handoff boundaries
        run: uv run pytest -q tests/test_gui_canonical_chat_composer.py
      - name: GUI session ownership boundaries
        run: uv run pytest -q tests/test_gui_session_reads.py tests/test_gui_fixture_timeouts.py
      - name: Selected auxiliary readiness boundaries
        run: uv run pytest -q tests/test_gui_fixture_readiness.py tests/test_gui_endpoints.py::test_selected_aux_owns_liveliness_and_sidebar_remains_bounded
      - name: Windows fixture portability and auxiliary clock boundaries
        if: runner.os == 'Windows'
        run: uv run pytest -q tests/test_frontend_page_progress_retry.py tests/test_gui_chat_presentation.py
      # Fail native ABI/filesystem regressions before the long Windows suite.
      - name: Windows attachment handoff boundary
        if: runner.os == 'Windows'
        run: uv run pytest -q tests/test_gui_attachment_cache.py tests/test_gui_attachment_read.py tests/test_gui_cache_filename.py
      # Diagnostic experiment: the Windows full suite is roughly four times
      # slower than Ubuntu. Keep checkout, dependency installation and focused
      # boundary tests protected; allow this only for trusted same-repo PRs.
      - name: Disable Defender real-time monitoring for full-suite benchmark
        if: runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: powershell
        run: |
          $before = (Get-MpComputerStatus).RealTimeProtectionEnabled
          Set-MpPreference -DisableRealtimeMonitoring $true
          $after = (Get-MpComputerStatus).RealTimeProtectionEnabled
          Write-Output "Defender real-time protection: before=$before after=$after"
          if ($after) { throw "Defender benchmark did not disable real-time monitoring" }
      - name: Tests
        run: uv run pytest -q
      - name: Restore Defender real-time monitoring after benchmark
        if: always() && runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: powershell
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $false
          $after = (Get-MpComputerStatus).RealTimeProtectionEnabled
          Write-Output "Defender real-time protection restored: $after"
          if (-not $after) { throw "Defender real-time monitoring was not restored" }
